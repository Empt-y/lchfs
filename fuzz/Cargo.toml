[package]
name = "lchfs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Deliberately its own workspace, not a member of the parent one -- cargo-fuzz's
# standard pattern: fuzz targets pull in nightly-only sanitizer instrumentation
# flags that the main crates must never be built with.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

arbitrary = { version = "1", features = ["derive"] }
tempfile = "3"

[dependencies.lchfs-store]
path = "../crates/lchfs-store"

[dependencies.lchfs-fsck]
path = "../crates/lchfs-fsck"

[dependencies.lchfs-format]
path = "../crates/lchfs-format"

[dependencies.lchfs-crypto]
path = "../crates/lchfs-crypto"

[[bin]]
name = "extent_header"
path = "fuzz_targets/extent_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shard_page"
path = "fuzz_targets/shard_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "segment_file"
path = "fuzz_targets/segment_file.rs"
test = false
doc = false
bench = false

[[bin]]
name = "superblock_ring"
path = "fuzz_targets/superblock_ring.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stripe_mutation"
path = "fuzz_targets/stripe_mutation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "keyring_parse"
path = "fuzz_targets/keyring_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "envelope_open"
path = "fuzz_targets/envelope_open.rs"
test = false
doc = false
bench = false
