[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lchfs-crypto = { path = "crates/lchfs-crypto" }
lchfs-chunk = { path = "crates/lchfs-chunk" }
lchfs-compress = { path = "crates/lchfs-compress" }
lchfs-format = { path = "crates/lchfs-format" }
lchfs-index = { path = "crates/lchfs-index" }
lchfs-store = { path = "crates/lchfs-store" }
lchfs-fuse = { path = "crates/lchfs-fuse" }
lchfs-fsck = { path = "crates/lchfs-fsck" }
lchfs-cli = { path = "crates/lchfs-cli" }
lchfs-testkit = { path = "crates/lchfs-testkit" }

blake3 = "1.8.5"
crc32fast = "1.5.0"
zstd = "0.13.3"
fastcdc = "4.0.1"
redb = "4.1.0"
crossbeam = "0.8.4"
parking_lot = "0.12.5"
roaring = "0.11.4"
rayon = "1.10.0"
fuser = "0.18.0"
nix = "0.31.3"
bytes = "1.9.0"
serde = { version = "1.0.229", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0.19"
anyhow = "1.0.104"
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
clap = { version = "4.6.4", features = ["derive"] }
proptest = "1.11.0"
tempfile = "3.27.0"
criterion = "0.8.2"
chacha20poly1305 = "0.11.0"
argon2 = "0.6.0"
x-wing = { version = "0.1.0", features = ["getrandom", "zeroize"] }
zeroize = { version = "1.9.0", features = ["derive"] }
getrandom = "0.3.4"
tss-esapi = "7.7.0"
hex = "0.4"
arc-swap = "1.9"

[package]
name = "lchfs"
description = "Log-Structured Cryptographic Hash File System"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "lchfs"
path = "src/main.rs"

[dependencies]
lchfs-cli = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
lchfs-crypto = { workspace = true }
