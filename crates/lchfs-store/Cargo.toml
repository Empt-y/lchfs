[package]
name = "lchfs-store"
description = "LCHFS engine: segments, logical-shard ingress, checkpointing, GC. FUSE-agnostic (see ARCHITECTURE.md §5a)."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
lchfs-format = { workspace = true }
lchfs-crypto = { workspace = true }
lchfs-compress = { workspace = true }
lchfs-chunk = { workspace = true }
reed-solomon-erasure = "6"
lchfs-index = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }
roaring = { workspace = true }
rayon = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }
arc-swap = { workspace = true }

[features]
# Test-only: lets a test declare a device root dead so every replica
# operation under it fails. See `segment::fault_injection`.
fault-injection = []
# Diagnostic-only: accumulate per-stage write-path timing (lock acquisition
# and cross-thread handoffs) and dump it at `Pool::drop`. Zero-cost when off;
# used to attribute the write-path scaling limit (ARCHITECTURE.md §17.0).
write-timing = []
# See lchfs-crypto's Cargo.toml comment: makes every pool this crate
# creates or opens without an explicit key encrypted, under a fixed test
# passphrase, so the existing test suite can run entirely against
# encrypted pools with no test code changed. Never for a real build.
test-encrypt-all = ["lchfs-crypto/test-encrypt-all"]

[dev-dependencies]
lchfs-store = { path = ".", features = ["fault-injection"] }
tempfile = { workspace = true }
criterion = { workspace = true }
lchfs-fsck = { workspace = true }
nix = { workspace = true, features = ["user"] }

[[bench]]
name = "concurrent_writes"
harness = false

[[bench]]
name = "concurrent_reads"
harness = false
