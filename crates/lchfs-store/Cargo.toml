[package]
name = "lchfs-store"
description = "LCHFS engine: segments, logical-shard ingress, checkpointing, GC. FUSE-agnostic (see ARCHITECTURE.md §5a)."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
lchfs-format = { workspace = true }
lchfs-crypto = { workspace = true }
lchfs-compress = { workspace = true }
lchfs-chunk = { workspace = true }
reed-solomon-erasure = "6"
lchfs-index = { workspace = true }
crossbeam = { workspace = true }
parking_lot = { workspace = true }
roaring = { workspace = true }
rayon = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
nix = { workspace = true, features = ["fs", "user"] }

[features]
# Test-only: lets a test declare a device root dead so every replica
# operation under it fails. See `segment::fault_injection`.
fault-injection = []

[dev-dependencies]
lchfs-store = { path = ".", features = ["fault-injection"] }
tempfile = { workspace = true }
criterion = { workspace = true }
lchfs-fsck = { workspace = true }
nix = { workspace = true, features = ["user"] }

[[bench]]
name = "concurrent_writes"
harness = false
