[package]
name = "lchfs-cli"
description = "LCHFS command-line interface: create-pool, mount, fsck, snapshot, stats"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
lchfs-fuse = { workspace = true }
lchfs-nfs = { path = "../lchfs-nfs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
lchfs-fsck = { workspace = true }
lchfs-store = { workspace = true }
lchfs-index = { workspace = true }
lchfs-format = { workspace = true }
fuser = { workspace = true }
clap = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
