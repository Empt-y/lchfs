[package]
name = "lchfs-fsck"
description = "DAG-walk verification/diagnostics library for LCHFS, shared by the CLI and crash-consistency tests"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# See lchfs-crypto's Cargo.toml comment: forwarded so the whole workspace
# test suite can build with one flag.
test-encrypt-all = ["lchfs-crypto/test-encrypt-all"]

[lints]
workspace = true

[dependencies]
lchfs-store = { workspace = true }
lchfs-index = { workspace = true }
lchfs-format = { workspace = true }
lchfs-crypto = { workspace = true }
lchfs-device = { workspace = true }
reed-solomon-erasure = "6"
thiserror = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
