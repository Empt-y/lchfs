name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # fuser (lchfs-fuse) links against libfuse3 via pkg-config at build time.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 pkg-config libtss2-dev swtpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # fuzz/ is a separate, self-contained cargo-fuzz workspace that
          # needs nightly-only sanitizer flags -- deliberately excluded
          # from this stable-toolchain CI job (see README.md's Fuzzing
          # section for how to run it by hand).
          workspaces: ". -> target"

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A pool on a real block device (the tests use sparse images).
      - name: Loop device
        run: sudo ci/loop-device.sh target/debug/lchfs

      # The whole suite again with every pool the engine creates encrypted
      # under a fixed test passphrase (lchfs-crypto's `test-encrypt-all`),
      # so every existing test also exercises sealed records, keyed
      # addressing and the keyring -- not just the tests written for them.
      # Optimized: unoptimized XChaCha20/BLAKE3 is slow enough that the
      # concurrency tests' checkpoint loop is starved in a debug build
      # (~3x the plaintext run, too few checkpoints to race anything).
      - name: Test (every pool encrypted)
        run: cargo test --workspace --release --features lchfs-crypto/test-encrypt-all

      - name: Clippy (every pool encrypted)
        run: cargo clippy --workspace --all-targets --features lchfs-crypto/test-encrypt-all -- -D warnings

      # TPM2 key slots (lchfs-crypto's `tpm` feature, which links the
      # system tpm2-tss; the CLI turns it on, so the workspace steps above
      # build it too) against a throwaway software TPM -- never a real one:
      # the tests deliberately enter a wrong PIN, which counts toward a
      # TPM's dictionary-attack lockout.
      - name: TPM slot tests (swtpm)
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm"
          swtpm socket --tpm2 --tpmstate dir="$RUNNER_TEMP/swtpm" \
            --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
            --flags not-need-init,startup-clear &
          sleep 1
          LCHFS_TEST_TPM=1 LCHFS_TPM_TCTI="swtpm:host=127.0.0.1,port=2321" \
            cargo test -p lchfs-crypto --features tpm
          cargo clippy -p lchfs-crypto --all-targets --features tpm -- -D warnings

      # The CLI's TPM unlock, against a second, fresh software TPM: the
      # crypto tests' wrong PINs above already count toward the first
      # one's lockout.
      - name: CLI TPM unlock (swtpm)
        run: |
          mkdir -p "$RUNNER_TEMP/swtpm-cli"
          swtpm socket --tpm2 --tpmstate dir="$RUNNER_TEMP/swtpm-cli" \
            --server type=tcp,port=2331 --ctrl type=tcp,port=2332 \
            --flags not-need-init,startup-clear &
          sleep 1
          LCHFS_TEST_TPM=1 LCHFS_TPM_TCTI="swtpm:host=127.0.0.1,port=2331" \
            cargo test --test cli_encryption a_tpm
