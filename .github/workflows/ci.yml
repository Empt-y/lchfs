name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # fuser (lchfs-fuse) links against libfuse3 via pkg-config at build time.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # fuzz/ is a separate, self-contained cargo-fuzz workspace that
          # needs nightly-only sanitizer flags -- deliberately excluded
          # from this stable-toolchain CI job (see README.md's Fuzzing
          # section for how to run it by hand).
          workspaces: ". -> target"

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
